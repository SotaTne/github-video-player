<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Video Player Frame</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        max-height: 520px;
        object-fit: contain;
        background: transparent;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <video id="player" controls playsinline preload="metadata"></video>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
